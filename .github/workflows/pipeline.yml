name: Machine Failure MLOps Pipeline

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: machine-failure-model-training
  cancel-in-progress: false

jobs:
  # JOB 1: REGISTER AND VALIDATE THE RAW DATASET
  register-dataset:
    name: Register Dataset
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Register and validate dataset
        run: python model_building/register.py

      - name: Upload registered dataset
        uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: data/machine-failure-prediction.csv
          if-no-files-found: error
          retention-days: 7

  # JOB 2: CREATE STRATIFIED TRAINING AND TEST DATASETS
  data-preparation:
    name: Data Preparation
    needs: register-dataset
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Download registered dataset
        uses: actions/download-artifact@v4
        with:
          name: registered-data
          path: data

      - name: Prepare data
        run: python model_building/prep.py

      - name: Upload train and test datasets
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            Xtrain.csv
            Xtest.csv
            ytrain.csv
            ytest.csv
          if-no-files-found: error
          retention-days: 7

  # JOB 3: TRAIN, EVALUATE AND SAVE THE MODEL
  model-training:
    name: Model Training
    needs: data-preparation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Download train and test datasets
        uses: actions/download-artifact@v4
        with:
          name: data-splits
          path: .

      - name: Train and evaluate model
        run: python model_building/train.py

      - name: Confirm trained model exists
        run: |
          test -f deployment/best_machine_failure_model_v1.joblib
          ls -lh deployment/best_machine_failure_model_v1.joblib

      - name: Commit trained model
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          MODEL_FILE="deployment/best_machine_failure_model_v1.joblib"

          if [[ -n "$(git status --porcelain -- "$MODEL_FILE")" ]]; then
            git add "$MODEL_FILE"
            git commit -m "Update trained machine-failure model [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "The trained model is unchanged; no commit is required."
          fi
